AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3

Layout/LineLength:
  Max: 120

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'

Metrics/ClassLength:
  CountAsOne: ['array']
  Exclude:
    - 'test/**/*'

Metrics/CollectionLiteralLength:
  Exclude:
    - 'lib/zm/client/account/account.rb'
    - 'lib/zm/client/cos/cos.rb'
    - 'lib/zm/client/resource/resource.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'

Naming/PredicateMethod:
  AllowBangMethods: true
